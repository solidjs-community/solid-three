name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - next

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: install latest corepack
        run: npm install corepack@latest -g

      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --allow-build=esbuild

      - name: Build project
        run: pnpm build

      - name: Build demo
        run: pnpm build:dev

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./playground/dist # Adjust if your build output directory is different
          publish_branch: gh-pages # Specify the branch to deploy to
